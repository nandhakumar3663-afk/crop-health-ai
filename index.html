<!DOCTYPE html>
<html>
<head>

    <title>Crop Health AI</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3faf5;
        }

        .hero {
            background: linear-gradient(
                135deg,
                #087f3d,
                #16a34a
            );

            color: white;
            padding: 45px;
            text-align: center;
        }

        .hero h1 {
            font-size: 45px;
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 20px;
            margin-bottom: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,.08);
        }

        button {
            background: #16a34a;
            color: white;
            border: none;
            padding: 14px 25px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #15803d;
        }

        #preview {
            max-width: 400px;
            margin-top: 20px;
            border-radius: 15px;
        }

        .result {
            font-size: 22px;
            font-weight: bold;
            color: #166534;
        }

    </style>

</head>

<body>

<div class="hero">

    <h1>🌱 Crop Health AI</h1>

    <p>
        AI-powered plant disease detection
    </p>

</div>


<div class="container">

    <div class="card">

        <h2>📤 Upload Leaf Image</h2>

        <input
            type="file"
            id="fileInput"
            accept="image/*"
        >

        <br><br>

        <img
            id="preview"
            style="display:none;"
        >

        <br><br>

        <button onclick="analyze()">
            🔬 Analyze Crop
        </button>

    </div>


    <div class="card">

        <h2>📊 AI Analysis Result</h2>

        <div id="result">
            Upload an image to begin.
        </div>

    </div>

</div>


<script>

async function analyze() {

    const fileInput =
        document.getElementById(
            "fileInput"
        );

    if (!fileInput.files.length) {

        alert(
            "Please upload a leaf image first."
        );

        return;
    }


    const file =
        fileInput.files[0];


    const formData =
        new FormData();

    formData.append(
        "file",
        file
    );


    document.getElementById(
        "result"
    ).innerHTML =
        "🧠 Analyzing...";


    try {

        const response =
            await fetch(
                "/api/predict",
                {
                    method: "POST",
                    body: formData
                }
            );


        const data =
            await response.json();


        let html = `

            <div class="result">
                🌿 ${data.prediction}
            </div>

            <br>

            <strong>
                Confidence:
            </strong>

            ${data.confidence}%

            <br><br>

            <strong>
                Disease Status:
            </strong>

            ${data.status}

            <br><br>

            <strong>
                🏆 Top Predictions
            </strong>

        `;


        data.top_predictions
            .forEach(
                (item, index) => {

                    html += `

                        <p>
                            ${index + 1}.
                            ${item.class}
                            -
                            ${item.confidence.toFixed(2)}%
                        </p>

                    `;

                }
            );


        document.getElementById(
            "result"
        ).innerHTML = html;


    } catch (error) {

        document.getElementById(
            "result"
        ).innerHTML =
            "❌ Prediction failed.";

        console.error(error);

    }

}


document.getElementById(
    "fileInput"
).addEventListener(
    "change",
    function(event) {

        const file =
            event.target.files[0];

        if (!file) return;


        const preview =
            document.getElementById(
                "preview"
            );

        preview.src =
            URL.createObjectURL(file);

        preview.style.display =
            "block";

    }
);

</script>

</body>
</html>
